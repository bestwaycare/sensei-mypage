<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理者ページ - ベストウェイ模擬試験</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#f0f4f8;color:#333;font-size:13px}
.hd{background:#1565c0;color:#fff;padding:14px 16px;text-align:center}
.hd h1{font-size:17px}.hd p{font-size:11px;margin-top:3px;opacity:.8}
.bar{background:#0d47a1;color:#fff;padding:8px 14px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.wrap{padding:12px}
.ld{text-align:center;padding:60px 20px;color:#888}
.sp{width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#1565c0;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.summary{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sc{background:#fff;border-radius:8px;padding:10px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08);flex:1;min-width:120px;text-align:center}
.sc .num{font-size:24px;font-weight:bold;color:#1565c0}
.sc.ok .num{color:#2e7d32}.sc.ng .num{color:#c62828}
.sc .lbl{font-size:11px;color:#888;margin-top:2px}
.filter{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.filter input,.filter select{padding:7px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff}
.filter input{flex:1;min-width:160px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
thead tr{background:#e3f2fd}
th{padding:9px 10px;text-align:left;color:#1565c0;font-size:11px;font-weight:bold;border-right:1px solid #e0e0e0;white-space:nowrap}
th:last-child{border-right:none}
td{padding:8px 10px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f5f5f5;vertical-align:top}
td:last-child{border-right:none}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f0f7ff}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:bold}
.tag.ok{background:#e8f5e9;color:#2e7d32}
.tag.ng{background:#ffebee;color:#c62828}
.round-cell{min-width:150px}
.r-count{font-size:11px;color:#888;margin-bottom:4px}
.r-name{display:block;padding:2px 0;border-bottom:1px solid #f5f5f5;white-space:nowrap}
.r-name:last-child{border-bottom:none}
.r-empty{color:#ccc;font-size:11px}
</style>
</head>
<body>
<div class="hd">
  <h1>&#x7ba1;&#x7406;&#x8005;&#x30da;&#x30fc;&#x30b8; &#x30d9;&#x30b9;&#x30c8;&#x30a6;&#x30a7;&#x30a4;&#x6a21;&#x64ec;&#x8a66;&#x9a13;</h1>
  <p>&#x5168;&#x5148;&#x751f;&#x4e00;&#x89a7;</p>
</div>
<div class="bar">
  <span id="lastUpdate">&#x8aad;&#x307f;&#x8fbc;&#x307f;&#x4e2d;...</span>
  <span id="totalCount"></span>
</div>
<div class="wrap">
  <div id="loading" class="ld"><div class="sp"></div>&#x30c7;&#x30fc;&#x30bf;&#x3092;&#x53d6;&#x5f97;&#x4e2d;...</div>
  <div id="main" style="display:none">
    <div class="summary">
      <div class="sc"><div class="num" id="s-total">0</div><div class="lbl">&#x5168;&#x5148;&#x751f;</div></div>
      <div class="sc ok"><div class="num" id="s-ok">0</div><div class="lbl">&#x751f;&#x5e74;&#x6708;&#x65e5;&#x767b;&#x9332;&#x6e08;</div></div>
      <div class="sc ng"><div class="num" id="s-ng">0</div><div class="lbl">&#x672a;&#x767b;&#x9332;</div></div>
    </div>
    <div class="filter">
      <input type="text" id="searchBox" placeholder="&#x540d;&#x524d;&#x30fb;&#x6559;&#x5ba4;&#x540d;&#x3067;&#x6319;&#x7d1e;" oninput="filterTable()">
      <select id="filterDob" onchange="filterTable()">
        <option value="">&#x751f;&#x5e74;&#x6708;&#x65e5; &#x3059;&#x3079;&#x3066;</option>
        <option value="ok">&#x767b;&#x9332;&#x6e08;&#x307f;</option>
        <option value="ng">&#x672a;&#x767b;&#x9332;</option>
      </select>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th>&#x6559;&#x5ba4;&#x540d;</th>
            <th>&#x5148;&#x751f;&#x540d;</th>
            <th>&#x751f;&#x5e74;&#x6708;&#x65e5;</th>
            <th class="round-cell">&#x7b2c;1&#x56de; &#x53d7;&#x8b1b;&#x751f;</th>
            <th class="round-cell">&#x7b2c;2&#x56de; &#x53d7;&#x8b1b;&#x751f;</th>
            <th class="round-cell">&#x7b2c;3&#x56de; &#x53d7;&#x8b1b;&#x751f;</th>
            <th class="round-cell">&#x7b2c;4&#x56de; &#x53d7;&#x8b1b;&#x751f;</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
<script>
var P="https://corsproxy.io/?url=",D="azoch3bdyyq2.cybozu.com",A=267,TK="SSE6S1AfjBmvoXVF2fkZMSJXIvrFhzfGyQW0Cn8B";
var allRecs=[];
function qu(q){return P+encodeURIComponent("https://"+D+"/k/v1/records.json?app="+A+"&query="+encodeURIComponent(q)+"&_t="+Date.now());}
function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function get(r,c){return r[c]&&r[c].value?r[c].value:"";}

function getStudents(r,subtable,nameField){
  var rows=r[subtable]&&r[subtable].value?r[subtable].value:[];
  return rows.filter(function(x){return x.value&&x.value[nameField]&&x.value[nameField].value;})
             .map(function(x){return x.value[nameField].value;});
}

function renderStudentCell(names){
  if(!names.length)return '<span class="r-empty">-</span>';
  return '<div class="r-count">'+names.length+'&#x540d;</div>'+
    names.map(function(n){return '<span class="r-name">'+esc(n)+'</span>';}).join('');
}

function loadAll(){
  fetch(qu("$id > 0 limit 100"),{headers:{"X-Cybozu-API-Token":TK}})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.code){
      document.getElementById("loading").innerHTML="<p style='color:#c62828'>Kintoneエラー: "+esc(d.code)+" - "+esc(d.message)+"</p>";
      return;
    }
    allRecs=d.records||[];
    document.getElementById("loading").style.display="none";
    document.getElementById("main").style.display="block";
    var now=new Date();
    document.getElementById("lastUpdate").textContent=now.getFullYear()+"/"+(now.getMonth()+1)+"/"+now.getDate()+" "+now.getHours()+":"+String(now.getMinutes()).padStart(2,"0")+"取得";
    document.getElementById("totalCount").textContent=allRecs.length+"件";
    renderTable(allRecs);
  })
  .catch(function(e){
    document.getElementById("loading").innerHTML="<p style='color:#c62828'>取得失敗: "+String(e)+"</p><p>ページを再読み込みしてください</p>";
  });
}

function renderTable(recs){
  var ok=0,ng=0;
  var rounds=[
    {s:"第1回受講生",n:"第1回受講生氏名"},
    {s:"第2回受講生",n:"第2回受講生氏名"},
    {s:"第3回受講生",n:"第3回受講生氏名"},
    {s:"第4回受講生",n:"第4回受講生氏名"}
  ];
  var html="";
  recs.forEach(function(r){
    var name=get(r,"文字列__1行_");
    var dob=get(r,"生年月日");
    var kyoshitsu=get(r,"教室名");
    if(dob)ok++;else ng++;
    html+="<tr>";
    html+="<td style='white-space:nowrap'>"+esc(kyoshitsu)+"</td>";
    html+="<td style='white-space:nowrap'>"+esc(name)+"</td>";
    html+="<td style='white-space:nowrap'>"+(dob?'<span class="tag ok">'+esc(dob)+'</span>':'<span class="tag ng">未登録</span>')+"</td>";
    rounds.forEach(function(rd){
      var names=getStudents(r,rd.s,rd.n);
      html+='<td class="round-cell">'+renderStudentCell(names)+"</td>";
    });
    html+="</tr>";
  });
  document.getElementById("tbody").innerHTML=html;
  document.getElementById("s-total").textContent=recs.length;
  document.getElementById("s-ok").textContent=ok;
  document.getElementById("s-ng").textContent=ng;
}

function filterTable(){
  var q=document.getElementById("searchBox").value.toLowerCase();
  var dob=document.getElementById("filterDob").value;
  var filtered=allRecs.filter(function(r){
    var name=(get(r,"文字列__1行_")||"").toLowerCase();
    var kyoshitsu=(get(r,"教室名")||"").toLowerCase();
    var dobVal=get(r,"生年月日");
    if(q&&name.indexOf(q)<0&&kyoshitsu.indexOf(q)<0)return false;
    if(dob==="ok"&&!dobVal)return false;
    if(dob==="ng"&&dobVal)return false;
    return true;
  });
  renderTable(filtered);
}
loadAll();
</script>
</body>
</html>
