<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先生マイページ - ベストウェイ模擬試験</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, Hiragino Sans, Meiryo, sans-serif; background: #f0f4f8; color: #333; min-height: 100vh; }
.header { background: #2e7d32; color: white; padding: 16px; text-align: center; }
.header h1 { font-size: 18px; }
.header p { font-size: 12px; margin-top: 4px; opacity: .8; }
#login-screen { max-width: 420px; margin: 40px auto; padding: 0 16px; }
.card { background: white; border-radius: 12px; padding: 28px 24px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
.card h2 { font-size: 17px; margin-bottom: 24px; color: #2e7d32; text-align: center; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; font-weight: bold; }
.form-group input { width: 100%; padding: 13px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
.form-group input:focus { outline: none; border-color: #2e7d32; }
.btn-login { width: 100%; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 4px; }
.btn-login:hover { background: #1b5e20; }
.btn-login:disabled { background: #aaa; cursor: not-allowed; }
.error-msg { color: #c62828; font-size: 13px; text-align: center; margin-top: 14px; padding: 10px; background: #ffebee; border-radius: 6px; }
#main-screen { display: none; }
.user-bar { background: #1b5e20; color: white; padding: 10px 16px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
.user-bar span { font-weight: bold; font-size: 15px; }
.btn-logout { background: rgba(255,255,255,.2); color: white; border: none; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
.tabs { display: flex; background: white; border-bottom: 2px solid #e0e0e0; position: sticky; top: 0; z-index: 10; }
.tab-btn { flex: 1; padding: 14px 8px; text-align: center; font-size: 14px; border: none; background: none; cursor: pointer; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab-btn.active { color: #2e7d32; border-bottom-color: #2e7d32; font-weight: bold; }
.tab-content { padding: 14px; display: none; }
.tab-content.active { display: block; }
.section-card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.section-card h3 { font-size: 15px; color: #2e7d32; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #e8f5e9; }
.info-row { display: flex; padding: 7px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; line-height: 1.5; }
.info-row:last-child { border-bottom: none; }
.info-label { width: 90px; color: #888; flex-shrink: 0; font-size: 12px; padding-top: 1px; }
.round-section { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.round-header { display: flex; align-items: center; margin-bottom: 12px; }
.round-header h3 { font-size: 15px; color: #2e7d32; }
.badge { background: #e8f5e9; color: #2e7d32; font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
.student-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.student-table th { background: #e8f5e9; padding: 8px 6px; text-align: left; color: #1b5e20; font-weight: bold; font-size: 12px; }
.student-table td { padding: 9px 6px; border-bottom: 1px solid #f0f0f0; }
.no-data { text-align: center; color: #bbb; padding: 20px; font-size: 13px; }
.loading { text-align: center; padding: 50px 20px; color: #888; }
.spinner { width: 36px; height: 36px; border: 3px solid #e0e0e0; border-top-color: #2e7d32; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="header"><h1>📋 先生マイページ</h1><p>ベストウェイ模擬試験お手伝いさん</p></div>
<div id="login-screen">
<div class="card">
<h2>🔐 ログイン</h2>
<div class="form-group"><label>お名前（登録名）</label><input type="text" id="input-name" placeholder="例：山田　花子" autocomplete="name"></div>
<div class="form-group"><label>生年月日</label><input type="date" id="input-dob"></div>
<button class="btn-login" id="login-btn" onclick="doLogin()">ログイン</button>
<div class="error-msg" id="login-error" style="display:none"></div>
</div>
</div>
<div id="main-screen">
<div class="user-bar"><div><span id="user-name-display"></span> 先生</div><button class="btn-logout" onclick="doLogout()">ログアウト</button></div>
<div class="tabs">
<button class="tab-btn active" id="tab-btn-venue" onclick="switchTab('venue',this)">🏢 会場情報</button>
<button class="tab-btn" id="tab-btn-students" onclick="switchTab('students',this)">👥 受講生一覧</button>
</div>
<div id="tab-venue" class="tab-content active">
<div class="loading" id="venue-loading"><div class="spinner"></div>読み込み中...</div>
<div id="venue-content" style="display:none"></div>
</div>
<div id="tab-students" class="tab-content"><div id="students-content"></div></div>
</div>
<script>
var PROXY="https://corsproxy.io/?url=",DOMAIN="azoch3bdyyq2.cybozu.com",APP=267,TOKEN="SSE6S1AfjBmvoXVF2fkZMSJXIvrFhzfGyQW0Cn8B";
var rec=null;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function apiUrl(path,query){return PROXY+encodeURIComponent("https://"+DOMAIN+path+(query?"?"+query:""));}
function doLogin(){
var name=document.getElementById("input-name").value.trim();
var dob=document.getElementById("input-dob").value;
var err=document.getElementById("login-error");
err.style.display="none";
if(!name||!dob){err.textContent="お名前と生年月日を入力してください";err.style.display="block";return;}
var btn=document.getElementById("login-btn");
btn.textContent="確認中...";btn.disabled=true;
var name1=name.replace(/ /g,"　");
var name2=name.replace(/　/g," ");
function tryQ(n,cb){
var q="app="+APP+"&query="+encodeURIComponent("文字列__1行_ = \""+n+"\" and 生年月日 = \""+dob+"\"");
fetch(apiUrl("/k/v1/records.json",q),{headers:{"X-Cybozu-API-Token":TOKEN}})
.then(function(r){return r.json();})
.then(function(d){cb(d.records&&d.records.length>0?d.records[0]:null);})
.catch(function(){cb(null);});
}
tryQ(name1,function(r){
if(r){rec=r;showMain();btn.textContent="ログイン";btn.disabled=false;}
else{tryQ(name2,function(r2){
if(r2){rec=r2;showMain();}
else{err.textContent="お名前または生年月日が一致しませんでした。登録内容をご確認ください。";err.style.display="block";}
btn.textContent="ログイン";btn.disabled=false;
});}
});
}
function doLogout(){rec=null;document.getElementById("main-screen").style.display="none";document.getElementById("login-screen").style.display="block";document.getElementById("input-name").value="";document.getElementById("input-dob").value="";document.getElementById("login-error").style.display="none";switchTab("venue",document.getElementById("tab-btn-venue"));}
function showMain(){document.getElementById("login-screen").style.display="none";document.getElementById("main-screen").style.display="block";document.getElementById("user-name-display").textContent=rec["文字列__1行_"].value;renderVenue();renderStudents();}
function switchTab(t,btn){document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});document.querySelectorAll(".tab-content").forEach(function(c){c.classList.remove("active");});btn.classList.add("active");document.getElementById("tab-"+t).classList.add("active");}
function get(c){return rec[c]&&rec[c].value?rec[c].value:"";}
function renderVenue(){
var days=[{l:"第1回",v:"１日目会場",a:"１日目会場住所",c:"１日目定員",m:"１日目最低開講人数",n:"１日目会場注意事項"},{l:"第2回",v:"２日目会場",a:"２日目会場住所",c:"２日目定員",m:"２日目最低開講人数",n:"２日目会場注意事項"},{l:"第3回",v:"_3日目会場",a:"_3日目会場住所",c:"_3日目定員",m:"_3日目最低開講人数",n:"_3日目会場注意事項"},{l:"第4回",v:"_4日目会場_0",a:"_4日目会場住所",c:"_4日目定員",m:"_4日目最低開講人数",n:"_4日目会場注意事項"}];
var h="<div class=\"section-card\"><h3>📌 基本情報</h3><div class=\"info-row\"><span class=\"info-label\">教室名</span><span>"+esc(get("教室名"))+"</span></div><div class=\"info-row\"><span class=\"info-label\">対応地域</span><span>"+esc(get("文字列__1行__0"))+"</span></div></div>";
var any=false;
days.forEach(function(d){var v=get(d.v);if(!v)return;any=true;
h+="<div class=\"section-card\"><h3>📍 "+d.l+"</h3><div class=\"info-row\"><span class=\"info-label\">会場名</span><span>"+esc(v)+"</span></div><div class=\"info-row\"><span class=\"info-label\">住所</span><span>"+esc(get(d.a))+"</span></div>";
if(get(d.c))h+="<div class=\"info-row\"><span class=\"info-label\">定員</span><span>"+esc(get(d.c))+" 名</span></div>";
if(get(d.m))h+="<div class=\"info-row\"><span class=\"info-label\">最低開講数</span><span>"+esc(get(d.m))+" 名</span></div>";
if(get(d.n))h+="<div class=\"info-row\"><span class=\"info-label\">注意事項</span><span>"+esc(get(d.n)).split("\n").join("<br>")+"</span></div>";
h+="</div>";
});
if(!any)h+="<div class=\"section-card\"><div class=\"no-data\">会場情報がまだ登録されていません</div></div>";
document.getElementById("venue-loading").style.display="none";
var el=document.getElementById("venue-content");el.innerHTML=h;el.style.display="block";
}
function renderStudents(){
var rounds=[{l:"第1回",c:"第1回受講生",d:"第1回申込日",n:"第1回受講生氏名",t:"第1回携帯電話番号"},{l:"第2回",c:"第2回受講生",d:"第2回申込日",n:"第2回受講生氏名",t:"第2回携帯電話番号"},{l:"第3回",c:"第3回受講生",d:"第3回申込日",n:"第3回受講生氏名",t:"第3回携帯電話番号"},{l:"第4回",c:"第4回受講生",d:"第4回申込日",n:"第4回受講生氏名",t:"第4回携帯電話番号"}];
var h="";
rounds.forEach(function(r){
var rows=rec[r.c]&&rec[r.c].value?rec[r.c].value:[];
h+="<div class=\"round-section\"><div class=\"round-header\"><h3>"+r.l+"</h3><span class=\"badge\">"+rows.length+" 名</span></div>";
if(rows.length>0){h+="<table class=\"student-table\"><thead><tr><th>申込日</th><th>氏名</th><th>電話番号</th></tr></thead><tbody>";
rows.forEach(function(row){h+="<tr><td>"+esc(row.value[r.d]?row.value[r.d].value:"")+"</td><td>"+esc(row.value[r.n]?row.value[r.n].value:"")+"</td><td>"+esc(row.value[r.t]?row.value[r.t].value:"")+"</td></tr>";});
h+="</tbody></table>";}else{h+="<div class=\"no-data\">受講生が登録されていません</div>";}
h+="</div>";
});
document.getElementById("students-content").innerHTML=h;
}
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&document.getElementById("login-screen").style.display!=="none")doLogin();});
</script>
</body>
</html>
